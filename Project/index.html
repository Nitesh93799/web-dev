<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group Project - Single Page</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Red Block Grab</h1>
    <nav>
        <a href="#" onclick="showPage('home')">Home</a>
        <a href="#" onclick="showPage('game')">Game</a>
        <a href="#" onclick="showPage('contact')">Contact</a>
    </nav>
</header>

<!-- Home Section -->
<section id="home" class="active">
    <h2>Welcome</h2>
    <p>This is our group project homepage.</p>

    <h3>Group Members</h3>
    <ul>
        <li>Nitesh</li>
        <li>Ashim</li>
        <li>Abiral</li>
    </ul>
</section>

<!-- Game Section -->
<section id="game">
    <h2>Red Block Grab</h2>
    <p>Use LEFT and RIGHT arrow keys to move the blue square and catch red squares!</p>

    <div class="game-area" id="gameArea">
        <div class="player" id="player"></div>
    </div>

    <p id="score">Score: 0</p>
</section>

<!-- Contact Section -->
<section id="contact">
    <h2>Contact Us</h2>
    <form>
        <label>Name:</label><br>
        <input type="text" name="name"><br><br>
        <label>Email:</label><br>
        <input type="email" name="email"><br><br>
        <label>Message:</label><br>
        <textarea name="message"></textarea><br><br>
        <button type="submit">Send</button>
    </form>
</section>

<footer>
    <p>AshimNiteshAbigal.gmail</p>
</footer>

<script src="script.js"></script>
</body>
</html>
